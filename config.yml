# ============================================================
# rs-webserver configuration
# ------------------------------------------------------------
# Note: this project ships a lightweight YAML-subset parser that
#       supports only "top-level key: value" pairs. Do not use
#       nested structures / lists.
#       Every key is optional; omitted keys use the defaults
#       noted below. Unknown keys cause a startup error, so
#       typos are caught early.
# ============================================================

# Number of worker threads in the pool (positive integer, must be > 0).
# Default: 4
pool_size: 4

# Task-queue capacity limit: the max number of tasks that may wait in the
# queue (positive integer, must be > 0). When the queue is full, new
# requests are rejected immediately with 503 (backpressure), so tasks
# can't pile up without bound.
# Default: 10000
max_queue_size: 10000

# Directory containing the static resources (HTML files), relative to the
# process working directory. The server reads hello.html (GET /) and
# 404.html (unmatched paths) from it.
# Default: resource/html
resources_dir: resource/html

# Listen address of the HTTP server.
# Default: 127.0.0.1:7878
bind_address: 127.0.0.1:7878
